<!DOCTYPE html>
<html lang="en" manifest="cache.manifest">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payload injector</title>
  <link rel="stylesheet" href="includes/style.css">
</head>
<body>

  <h1>Firmware Selection</h1>
  <h3 id="UA">Running on:</h3>

  <hr>

  <div class="btn-container">
    <form id="kernel-options">
      <input type="radio" name="kernel" id="netctrl-exploit" value="netctrl">
      <label for="netctrl-exploit">NetCtrl</label>
      <input type="radio" name="kernel" id="lapse-exploit" value="lapse">
      <label for="lapse-exploit">Lapse</label>
    </form>

    <div id="version-buttons">
      <!-- Buttons will be generated dynamically by script.js -->
    </div>
  </div>

  <div class="main-layout">
    <div class="media-box">
      <img src="includes/cat.jpg" alt="Monero > all">
    </div>

    <pre id="console">Ready. Awaiting execution...
  </pre>
  </div>

  <!-- auto-jailbreak checkbox -->
  <div style="margin-top: 1rem;">
    <label for="autoJbInput">Auto Jailbreak</label>
    <input type="checkbox" id="autoJbInput">
    <span id="autoJbLabel">Auto Jailbreak</span>
  </div>

  <script src="src/main.js"></script>
  <script src="includes/script.js"></script>
</body>
</html>
